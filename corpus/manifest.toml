# Corpus manifest: the list of libraries under test + per-run status ledger.
# status is managed by the driver: pending | done | error.
# Fixtures (slug starting with "_") are hand-written, have no submodule, and bank the
# trivial/virtual paths; external entries pin a real upstream as a git submodule.

[[repo]]
slug        = "_fixture_pod"
tier        = 0
header_only = true
url         = ""
pin         = ""
status      = "done"          # outcome E (single-stage pipeline proof)

[[repo]]
slug        = "_fixture_virtual"
tier        = 4
header_only = true
url         = ""
pin         = ""
status      = "done"          # outcome E (two-stage codegen / virtual override proof)

[[repo]]
slug         = "linalg"
tier         = 0
header_only  = true
url          = "https://github.com/sgorsten/linalg"
pin          = "v2.2"
include_root = "../../libs/linalg"
status       = "done"         # outcome E after BINDER-0001 fix (was B)

[[repo]]
slug         = "glm"
tier         = 1
header_only  = true
url          = "https://github.com/g-truc/glm"
pin          = "1.0.1"
include_root = "../../libs/glm"
status       = "done"         # outcome E (vec3/vec4 ctor+index surface); BINDER-0002/0003 found

[[repo]]
slug         = "json"
tier         = 1
header_only  = true
url          = "https://github.com/nlohmann/json"
pin          = "v3.11.3"
include_root = "../../libs/json/single_include"
status       = "done"         # outcome B: basic_json intractable on this toolchain (TC-0002);
                              # yielded BINDER-0004 (self-referential recursion + heavy-type perf)

