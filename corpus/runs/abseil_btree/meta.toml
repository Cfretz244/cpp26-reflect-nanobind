# Per-run descriptor for Abseil (20250814.2) btree containers. Consumed by run_gates.py.
slug         = "abseil_btree"
tier         = 6                          # Abseil special case (themed: btree containers)
header_only  = false
url          = "https://github.com/abseil/abseil-cpp"
pin          = "20250814.2"               # commit 0cf0a5c9
include_root = "../../libs/abseil"
main_headers = ["absl/container/btree_map.h", "absl/container/btree_set.h"]
module_name  = "abseil_btree_ext"
strategy     = "single_stage"
link_abseil  = true
extra_cflags = ["-fconstexpr-steps=1000000000"]   # btree_container ancestry bind-set fixpoint

reflect_args     = ["^^absl::btree_map<int, std::string>", "^^absl::btree_set<int>", "^^bttest"]
subset_rationale = "absl::btree_map/btree_set bound HEAD-ON (the ordered half of BINDER-0008). The container_internal btree_map_container/btree_set_container/btree_container ancestry becomes the flattened/Python-base chain via reachability discovery; the heterogeneous query surface (contains/count/find/erase/at/equal_range/lower_bound/upper_bound and operator[] -> __getitem__ with C++ default-insert semantics) binds via default-instantiable member templates with the TC-0004 dispatch-level substitution. bttest supplies value-setting population (insert's pair<iterator,bool> return is not Python-expressible)."
skipped_features = ["ordered ITERATION from Python (begin/lower_bound return iterator types; a future __iter__/make_iterator feature -- order is exercised natively in the oracle only)", "insert/extract/merge from Python (iterator/node_handle returns)", "emplace/try_emplace/insert_or_assign (parameter-pack member templates, skipped by design)"]

[emit]
enabled = true

[gcc16]
# The emit GENERATOR for the ordered btree-container surfaces (the
# btree_map_container/btree_set_container/btree_container ancestry + the
# heterogeneous query surface -- contains/count/find/erase/at/equal_range/
# lower_bound/upper_bound and operator[] -- rendered as qualified
# member-template calls) exhausts g++ 16.1's constant-evaluation memory:
# cc1plus was OOM-killed after ~196 s with the bare "Killed signal terminated
# program cc1plus" -- no error message, the GCC-0007 wall signature. clang-p2996
# renders the same 536-line TU fine (365 s). This is a resource wall, not a
# correctness gap: the constexpr lane is fully green under g++ (26.8 s, 4/4
# tests -- the bind set is clean, NOT the libstdc++-leakage false alarm that
# unordered_dense hit). This is the ordered sibling of abseil_hash, the second
# genuine GCC-0007 container run; its 536-line TU is larger still than
# abseil_hash's 509-line one. See
# corpus/findings/GCC-0007-emit-generator-constexpr-memory.md.
emit_enabled = false
