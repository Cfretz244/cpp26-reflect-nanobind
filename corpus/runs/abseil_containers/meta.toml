# Per-run descriptor for Abseil (20250814.2) containers. Consumed by run_gates.py.
slug         = "abseil_containers"
tier         = 6                          # Abseil special case (themed: containers)
header_only  = false
url          = "https://github.com/abseil/abseil-cpp"
pin          = "20250814.2"               # commit 0cf0a5c9
include_root = "../../libs/abseil"
main_headers = ["absl/container/inlined_vector.h"]
module_name  = "abseil_ext"
strategy     = "single_stage"

# Raised for the binder's completeness-aware signature gates (the BINDER-0014
# bind-time half, landed by the eigen run).
extra_cflags = ["-fconstexpr-steps=100000000"]
link_abseil  = true                       # -labsl_merged (+ CoreFoundation) via NB_EXTRA_LIBS

reflect_args     = ["^^nb::instantiate_<^^absl::InlinedVector, with_<^^int, val_<size_t(4)>>, with_<^^double, val_<size_t(2)>>, with_<^^std::string, val_<size_t(4)>>>"]
subset_rationale = "Binds three specializations of absl::InlinedVector (a small-buffer-optimized vector) DIRECTLY (no wrappers), minted by ONE instantiate_ rule with explicit with_ tuples -- the corpus's with_ exercise (mixed type+NTTP tuples, allocator filled by default-argument substitution; a failing tuple hard-errors, the loud half of the with_/product_ contract): <int,4> and <double,2> (the prior listings -- identical reflections, the unchanged legacy suite proving with_ == explicit) plus the new <std::string,4> -> distinct Python types InlinedVectorInt4/InlinedVectorDouble2/InlinedVectorString4, with the full push_back/pop_back/at/operator[]/front/back/size/capacity/clear/empty/reserve/resize/erase/insert surface; differentially checked vs native Abseil incl. the small-buffer spill -> heap capacity growth (now also with a non-trivially-copyable element type). Links the prebuilt absl static lib (InlinedVector::at() -> ThrowStdOutOfRange). The hash/btree containers (flat_hash_map/set, btree_*) and FixedArray are DEFERRED to BINDER-0008: their public query/insert APIs are member templates (heterogeneous lookup) the binder skips, they transitively expose ~35 container_internal types under mangled names, and FixedArray hits an Abseil-internal AsValueType instantiation; a clean binding needs internal-namespace skipping + member-template handling."
skipped_features = ["flat_hash_map/flat_hash_set/btree_map/btree_set: bind+link OK but explode into container_internal types and their query APIs are member-template-only (BINDER-0008)", "absl::FixedArray: Abseil-internal AsValueType<int> instantiation is ill-formed under the toolchain even after the array-member skip (BINDER-0008)"]

[emit]
enabled = true
