# Per-run descriptor for Abseil (20250814.2) hash containers. Consumed by run_gates.py.
slug         = "abseil_hash"
tier         = 6                          # Abseil special case (themed: hash containers)
header_only  = false
url          = "https://github.com/abseil/abseil-cpp"
pin          = "20250814.2"               # commit 0cf0a5c9
include_root = "../../libs/abseil"
main_headers = ["absl/container/flat_hash_map.h", "absl/container/flat_hash_set.h", "absl/container/node_hash_map.h"]
module_name  = "abseil_hash_ext"
strategy     = "single_stage"
link_abseil  = true
extra_cflags = ["-fconstexpr-steps=1000000000"]   # three-container bind-set fixpoint over the raw_hash_set surface

reflect_args     = ["^^absl::flat_hash_map<int, std::string>", "^^absl::flat_hash_set<int>", "^^absl::node_hash_map<int, std::string>", "^^hmtest"]
subset_rationale = "The BINDER-0008 payoff: absl::flat_hash_map/flat_hash_set/node_hash_map bound HEAD-ON. Reachability discovery (binder Change 1) keeps the container_internal policy explosion out (no FlatHashMapPolicy/Hash/Eq/Alloc types; only signature-reachable internals like node_handle and the raw_hash_map/raw_hash_set ancestry, which becomes the Python base chain). Default-instantiable member templates (binder Change 2 + the TC-0004 dispatch-level substitution workaround) bind the heterogeneous query surface directly: contains/count/find/erase/at/equal_range and operator[] -> __getitem__ (C++ semantics: default-inserts on miss). size/empty/clear/capacity/bucket_count/load_factor/rehash/reserve bind as plain methods. The hmtest fixture supplies only VALUE-SETTING population (put/add): insert()'s pair<iterator,bool> return has no Python representation (iterators are C++-only), and __getitem__ cannot express assignment."
skipped_features = ["insert/extract from Python (returns pair<iterator,bool>/node_handle; iterator types have no Python value semantics -- population via hmtest::put/add or d[k] default-insert)", "emplace/try_emplace/insert_or_assign/lazy_emplace (parameter-pack member templates, skipped by design)", "begin/end iteration (iterator-returning; a future __iter__/make_iterator feature)", "btree containers (sibling run abseil_btree)", "FixedArray (still blocked -- internal AsValueType instantiation; see BINDER-0008)"]

[emit]
enabled = true
# Stage-2 prod cflags default to constexpr extra_cflags minus reflection flags
# (here that strips -fconstexpr-steps=1000000000, leaving nothing -- the Abseil
# headers need no special prod flag). The prod Abseil archive
# (build/abseil-install-prod/lib/libabsl_merged.a) is linked mechanically by
# run_gates.py via link_abseil; the generated TU links clean against it. The
# emit generator's stage-1 raised step budget arrives via NB_GEN_CFLAGS.

[gcc16]
# The emit GENERATOR for the three hash-container surfaces (raw_hash_map/
# raw_hash_set ancestry + the heterogeneous query surface rendered as qualified
# member-template calls) exhausts g++ 16.1's constant-evaluation memory:
# cc1plus was OOM-killed after ~827 s with the bare "Killed signal terminated
# program cc1plus" -- no error message, the GCC-0007 wall signature. clang-p2996
# renders the same 509-line TU fine (240 s). This is a resource wall, not a
# correctness gap: the constexpr lane is fully green under g++ (30.6 s, 7/7
# tests incl. the no-policy-explosion structural check -- the bind set is clean,
# so this is NOT the libstdc++-leakage false alarm that unordered_dense hit).
# See corpus/findings/GCC-0007-emit-generator-constexpr-memory.md.
emit_enabled = false
