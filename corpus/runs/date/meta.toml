# Per-run descriptor for HowardHinnant/date v3.0.4. Consumed by run_gates.py.
slug         = "date"
tier         = 2                          # value types + a rich operator surface
header_only  = true                       # <date/date.h> only; tz.h is out of scope
url          = "https://github.com/HowardHinnant/date"
pin          = "v3.0.4"
include_root = "../../libs/date/include"
main_headers = ["date/date.h"]
module_name  = "date_ext"
strategy     = "single_stage"

reflect_args     = ["^^nb::match_<^^date, all_of_<is_class_, any_of_<named_<day>, named_<month*>, named_<year*>, named_<weekday*>, named_<last_spec>>>>", "^^datefix"]
subset_rationale = "date's calendrical VALUE types bound head-on, selected by ONE match_<^^date, all_of_<is_class_, any_of_<five name globs>>> marker: the prior seven explicit listings (same classes, same names -- the unchanged legacy suite is the match_ == explicit equivalence proof) plus the whole indexed/last family the globs extend to (weekday_indexed, weekday_last, month_day_last, month_weekday, month_weekday_last, year_month_day_last, year_month_weekday, year_month_weekday_last, and last_spec -- which makes the last DSL drivable from Python: weekday[last_spec] -> weekday_last via the __getitem__ overload pair, month/last_spec -> month_day_last, year/month/last_spec -> year_month_day_last, all through the already-bound free operator/ overloads). is_class_ keeps free functions out by construction; the globs are normalization-safe (the days/months/years aliases dealias to std::chrono::duration, identifier duration, which no glob matches; date::detail holds nothing the globs touch). The core types: year/month/day (each an opaque integral wrapper with explicit ctor, ok(), and a full free-operator surface), year_month and month_day (the two-field composites), year_month_day (the central y/m/d triple, with its operator sys_days() conversion exercised through the fixture), and weekday. The differential checks calendrical arithmetic (operator+/- with days/months/years free operators -> dunders), the six comparison operators -> rich-comparison dunders, weekday computation from a date, and formatted output. The datefix fixture bridges only what the real API cannot express to Python: the sys_days serial-day round-trip (date::sys_days is std::chrono::time_point<system_clock, days> -- a typedef over a chrono time_point with no nanobind caster, so year_month_day<->sys_days and weekday(sys_days) go through free functions over a plain day-count int) and date::format() (a function TEMPLATE over CharT/Traits/Streamable, unbindable; wrapped to take/return std::string)."
skipped_features = [
  "tz.h / time-zone database (needs tz.cpp compiled + an IANA tzdata install -- out of scope for the header-only run; only <date/date.h> is bound)",
  "operator++/-- (pre/post increment) -- the binder skips ++/-- per docs (no Python analog)",
  "date::format()/operator<< as bound entities -- function templates over CharT/Traits/Streamable, not bindable; formatted output is exercised through the datefix format_*() std::string wrappers",
  "the chrono duration typedefs days/months/years and sys_days/local_days as bound types -- chrono time_points/durations have no nanobind caster; arithmetic that needs them is reached through the value-type operators (day +/- days etc. take a bound operand) or the datefix serial-day bridge",
]

[emit]
enabled = true
