# Per-run descriptor for Eigen 5.0.1. Consumed by run_gates.py.
slug         = "eigen"
tier         = 5                          # expression-template library (the discovery stress test)
header_only  = true
url          = "https://gitlab.com/libeigen/eigen"
pin          = "5.0.1"                    # commit bc3b3987
include_root = "../../libs/eigen"
main_headers = ["Eigen/Core", "Eigen/Dense"]
module_name  = "eigen_ext"
strategy     = "single_stage"

# The whole-namespace consteval walks over four Matrix specs + their full CRTP
# facade chains (32 classes) need a raised step budget, like json/abseil_hash.
extra_cflags = ["-fconstexpr-steps=2147483647"]

reflect_args     = ["^^Eigen::Matrix<double,3,1>", "^^Eigen::Matrix<double,3,3>", "eigen_excluded_marker() (an ^^nb::exclude_<...> built in binding.cpp)", "^^eigentest"]
subset_rationale = "Vector3d/Matrix3d -- Eigen::Matrix<double,3,1> and <double,3,3>, the library's flagship concrete types -- bound HEAD-ON. This is the run the nb::exclude_ feature was built for: Eigen's facade methods return expression templates whose own facades mint ever-deeper specializations (transpose() -> Transpose<Derived> -> Transpose<Transpose<...>>; asPermutation() grows Matrix<N> to Matrix<N*N>), so unrestricted discovery DIVERGES, and walking some minted specs (NestByValue<expr>, SparseView under Eigen/Dense) is a hard error. With the expression/view/solver templates and Eigen::internal excluded, discovery converges to exactly 32 specs: the two seeds, Matrix<complex<double>,1,1>/<3,1> (from eigenvalues() declarations), and each one's CRTP facade chain (MatrixBase/DenseBase/PlainObjectBase/DenseCoeffsBase x3/EigenBase) -- which bind as REAL Python bases (the Tier-3 inheritance theme at Tier-5 scale: Matrix -> PlainObjectBase -> MatrixBase -> DenseBase -> DenseCoeffsBase<3/1/0> -> EigenBase, all isinstance-checkable). The bound member surface is the non-template facade API (norm/squaredNorm/sum/prod/mean/trace/determinant/coeff access via __call__ and __getitem__/setZero/setOnes/normalize/normalized/rows/cols/size, Vector3d's real (x,y,z) ctor, *=/ /= -> __imul__/__idiv__, streamability -> __str__). Eigen's arithmetic operators are function templates returning expression types -- intrinsically outside the binder's model (member templates bind only via all-defaulted default instantiation) -- so the eigentest fixture supplies the eager-value arithmetic (add/scale/dot/cross/matmul/matvec/transpose/inverse/solve/symmetric-eigenvalues), all taking/returning the BOUND Matrix types by value, exercising the registered-type caster path differentially."
skipped_features = [
  "expression-template returns (transpose/inverse/diagonal/block/head/tail/cwise*/replicate/reverse/asDiagonal/asPermutation/homogeneous/colwise/rowwise/real/imag/...) -- excluded via nb::exclude_; the eager-value equivalents are exercised through the eigentest fixture",
  "solver/decomposition objects (LLT/LDLT/*LU/*QR/SVD/eigensolvers/Jacobi) -- excluded; solve exercised eagerly via the fixture's partialPivLu().solve()",
  "Map/Ref views (raw-pointer semantics have no Python value story)",
  "fixed-size convenience ctors on WRONG-sized specs (Matrix(x,y,z) is a plain member of EVERY Matrix with a size static_assert in its BODY -- lazily ill-formed, undetectable by reflection; excluded per-member by reflection, the exclude_ member-level escape hatch). Same mechanism for the handful of facade members whose bodies are lazily ill-formed for some bound spec (e.g. eulerAngles on a vector).",
  "comma-initializer (operator<<(Scalar) -> CommaInitializer, excluded -- a C++ syntactic device with no Python equivalent)",
  "templated arithmetic operators (return expression types; see rationale)",
]

[emit]
enabled = true
# TC-0020 (candidate): Eigen declares DenseBase::setConstant's param `value`
# and defines it `val`; parameter identifier_of is redeclaration-dependent on
# this toolchain, so the two lanes legitimately render different kwarg names
# for this ONE method. Root-caused in
# corpus/findings/TC-0020-param-identifier-redecl-dependent.md.
surface_diff_ignore = ['\.attrs\.setConstant\.doc$']
