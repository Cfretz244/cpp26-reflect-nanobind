# Per-run descriptor for fmtlib/fmt (11.2.0). Consumed by corpus/lib/run_gates.py.
slug         = "fmt"
tier         = 2
header_only  = true
url          = "https://github.com/fmtlib/fmt"
pin          = "11.2.0"                  # commit 40626af8
include_root = "../../libs/fmt/include"  # relative to this run dir; the submodule
main_headers = ["fmt/format.h", "fmt/color.h", "fmt/ranges.h"]
module_name  = "fmt_ext"
strategy     = "single_stage"

# Gate 2 record.
reflect_args     = ["^^fmt::color", "^^fmt::terminal_color", "^^fmt::emphasis", "^^fmt::format_int", "^^fmt::to_string<int>", "^^fmt::to_string<double>", "^^fmt::to_string<long long>", "^^fmttest"]
# LIB-0001: fmt/format.h calls unqualified malloc()/free() without <cstdlib>; clang-p2996's strict
# two-phase lookup rejects it unless <cstdlib> is visible first. The binding/oracle TUs include
# <cstdlib> before fmt (consumer-side workaround, no fmt edit). See findings/LIB-0001.
subset_rationale = "Four layers of REAL fmt surface, all differentially checked vs native fmt. (1) fmt's enums color (~140 CSS-color enumerators)/terminal_color/emphasis, reflected directly. (2) fmt's real concrete class fmt::format_int (its fast int->string formatter): ctor overloads + str()/c_str()/data()/size() bind, private member templates skipped. (3) fmt's real FORMATTING API bound DIRECTLY from its own function-template instantiations fmt::to_string<int/double/long long> (the binder binds fmt's own symbol, not a wrapper). fmt's format()/print() front-ends take a CONSTEVAL format_string<Args...> first parameter not constructible at runtime from Python, so they are intrinsically not directly bindable; to_string<T>/format_int are the directly-bindable formatting entry points. (4) A fixture namespace fmttest of concrete wrappers over the runtime fmt::format engine that drives the remaining Tier-2 themes: keyword arguments (P3096 names -> nb::arg), std::string/std::vector casters incl. fmt::join, and the member-function-template gap (Formatter::apply<T> skipped while ordinary members bind)."
skipped_features = ["fmt::format/format_to/print/println front-ends: intrinsically not directly bindable (consteval format_string<Args...> first param); runtime path exercised via fmttest wrappers", "fmt::format_int private member templates format_signed/format_unsigned (binder skips member templates)", "Formatter::apply<T> member function template (binder gracefully skips member templates)"]

[emit]
enabled = true
