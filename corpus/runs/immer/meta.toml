# Per-run descriptor for immer v0.9.1. Consumed by run_gates.py.
slug         = "immer"
tier         = 4                          # persistent/immutable containers, value semantics
header_only  = true
url          = "https://github.com/arximboldi/immer"
pin          = "v0.9.1"
include_root = "../../libs/immer"
main_headers = ["immer/vector.hpp", "immer/map.hpp", "immer/set.hpp"]
module_name  = "immer_ext"
strategy     = "single_stage"

extra_cflags = ["-fconstexpr-steps=1000000000", "-Wno-deprecated-declarations"]  # heavy persistent-container bind-set fixpoint (rbtree/champ internals)

[emit]
enabled = true
# stage-2 (production compile) extra_cflags default to the constexpr lane's
# extra_cflags minus reflection-only flags: -fconstexpr-steps is reflection-only
# (stripped automatically) and -Wno-deprecated-declarations is harmless for the
# Apple-Clang compile of the plain generated source, so no override is needed.

reflect_args     = ["^^immer::vector<int>", "^^immer::vector<std::string>", "^^immer::map<int, int>", "^^immer::set<int>"]
subset_rationale = "immer's persistent containers bound head-on, four real concrete specializations listed explicitly (a spec's own template args are not signature-reachable): immer::vector<int>, immer::vector<std::string>, immer::map<int,int>, immer::set<int>. The differential's heart is value semantics with structural sharing: push_back/set/insert/erase RETURN A NEW container by value leaving the receiver untouched -- the test drives a chain of persistent updates through both native and Python and compares the CONTENTS OF EVERY intermediate version, asserting the original is unchanged after each op. This is the BINDER-0026 run: reflected constructors construct with PARENS via reflect_init (nb_paren_init.h), so immer::vector's fill ctor vector(size_type n, T v={}) -- which co-exists with an initializer_list<T> ctor that would hijack a braced Type{n,v} and narrow size_type->int -- binds correctly and is exercised by test_vector_fill_ctor_uses_parens_not_initializer_list on BOTH backends (13 differential + invariant tests, all green). Surfaces checked: size/empty/operator[]/at/back/front/push_back/set/take + fill-ctor + value __eq__ on vector; size/count/operator[]/at/find/insert(pair)/set/erase on map; size/count/find/insert/erase on set; at() out-of-range/key-not-found error paths -> IndexError. The default_memory_policy + bits template machinery and the whole immer::detail implementation namespace (rbtree/champ/node/iterator) are reached only through internal members and are excluded via nb::exclude_ (see skipped_features)."
skipped_features = [
  "the entire immer::detail namespace (rbts::rbtree/node/rbtree_iterator, hamts::champ/node/champ_iterator) excluded via nb::exclude_<^^immer::detail>. It is reachable from the public containers' begin()/end()/impl() but reflecting into it diverges HARD: the iterators derive from immer::detail::iterator_facade whose operator overloads re-check enable_if default template args naming its PROTECTED is_random_access/is_bidirectional from a no-access context (compile error), and the internal node types expose static factories whose pointer signatures trip the binder's static-method lambda. None of it is part of the persistent-value differential.",
  "iterators (begin/end and the rbts/hamts iterator types) -- not bound; immer is a value-semantics library and the differential reads vectors out via size()/operator[], maps/sets via count/find. Excluded as part of immer::detail above.",
  "transient/mutable APIs (transient(), vector_transient/map_transient/set_transient) -- immer's escape hatch for batched in-place mutation; out of scope for the persistent-value differential, and transient() returns a detail-namespace-adjacent type. Not bound.",
  "the std::initializer_list<T> constructors bind but are not Python-callable (no caster for initializer_list); harmless, never invoked. (The co-existing fill ctor vector(size_type, T) IS bound and Python-callable thanks to BINDER-0026 parens-init -- see subset_rationale.)",
  "update(key, Fn) / update(idx, Fn) -- take a function callback (member function template / non-defaulted Fn&&), gracefully skipped by the binder; persistent update is exercised via set() instead.",
]
