# Per-run descriptor for nlohmann/json (v3.11.3).
slug         = "json"
tier         = 1
header_only  = true
url          = "https://github.com/nlohmann/json"
pin          = "v3.11.3"                 # commit 9cca280a4
include_root = "../../libs/json/single_include"
main_headers = ["nlohmann/json.hpp"]
module_name  = "json_ext"
strategy     = "two_stage"               # codegen path for auto STL-caster includes

reflect_args     = ["^^nlohmann::json", "^^nlohmann::detail::value_t", "^^nlohmann::detail::error_handler_t", "^^jsontest"]
# basic_json reflection needs a raised constexpr-step budget (default ~1.05M).
# This is a legitimate budget bump — it no longer crashes after the TC-0002 fix
# (a use-after-free in clang's PopExpressionEvaluationContext / HandleImmediateInvocations;
# the Rec reference into ExprEvalContexts dangled when reentrant consteval reallocated it).
# 100M sufficed through the eigen-era binder; the wave-1 hardening's per-member
# bindability gates (BINDER-0015/0019 across basic_json's ~hundreds of members)
# pushed the two-stage GENERATOR TU past it -> 400M.
extra_cflags     = ["-fconstexpr-steps=400000000", "-DJSON_NO_IO"]
subset_rationale = "nlohmann::json = basic_json<>; the whole real value type is reflected (no facade). Value-ingestion/extraction is all member templates (correctly skipped), so jsontest helper factories supply populated inputs; the binder still exposes the real dump()/is_*()/size()/operator[]/== surface under test. Previously OUTCOME B: reflecting basic_json crashed clang-p2996 — originally mis-attributed to a constexpr/SLoc-exhaustion ceiling (TC-0002), but root-caused to a use-after-free in Sema (fixed in the pinned toolchain). With the fix + a raised constexpr-step budget, the real class binds."
skipped_features = ["all member templates: get<T>/parse/get_to/emplace_back/compat-ctors (Python uses jsontest factories instead)"]

[emit]
enabled = true

[gcc16]
# The emit GENERATOR for basic_json's surface exhausts g++ 16.1's
# constant-evaluation memory (cc1plus OOM-killed at >31 GB; clang-p2996
# renders the same TU in 1.69 GB peak RSS). Resource wall, not a correctness
# gap -- the constexpr lane is fully green under g++ (37 s). See
# corpus/findings/GCC-0006-emit-generator-constexpr-memory.md.
emit_enabled = false
