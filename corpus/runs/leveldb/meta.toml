# Per-run descriptor for leveldb 1.23 (Tier 4: a real embedded key/value store). Consumed by
# run_gates.py. Compiled library -- the driver prebuilt the merged archive under
# build/leveldb-install; extra_libs links it into both the module and the native oracle.
slug         = "leveldb"
tier         = 4
header_only  = false
url          = "https://github.com/google/leveldb"
pin          = "1.23"
include_root = "../../libs/leveldb/include"
main_headers = ["leveldb/db.h", "leveldb/status.h", "leveldb/slice.h", "leveldb/options.h", "leveldb/write_batch.h"]
module_name  = "leveldb_ext"
strategy     = "single_stage"
extra_libs   = "-L {repo}/build/leveldb-install/lib -lleveldb_merged"
# DB carries a wide virtual surface (Put/Delete/Write/Get/NewIterator/GetSnapshot/...)
# plus Slice's overloaded ctors and the option structs; the binder's discovery + caster +
# bind fixpoint over the bind set exceeds the default constexpr step budget, exactly as the
# json/pugixml/abseil heavy runs do. Raised here for the Gate 4 binding compile.
extra_cflags = ["-fconstexpr-steps=33554432"]

reflect_args     = [
  "^^leveldb::Status",
  "^^leveldb::Slice",
  "^^leveldb::Options",
  "^^leveldb::ReadOptions",
  "^^leveldb::WriteOptions",
  "^^leveldb::WriteBatch",
  "^^leveldb::CompressionType",
  "^^leveldbtest",
  # exclude_ makes the unbound surface opaque on every path (BINDER-0014): the Options
  # structs' forward-declared collaborator pointers (Comparator/Env/Cache/FilterPolicy/
  # Logger), the polymorphic Snapshot handle (ReadOptions::snapshot; itself RTTI-absent),
  # and WriteBatch::Handler (a pure-virtual visitor needing a Python override we do not surface).
  "^^nb::exclude_<^^leveldb::Comparator, ^^leveldb::Env, ^^leveldb::Cache, ^^leveldb::FilterPolicy, ^^leveldb::Logger, ^^leveldb::Snapshot, ^^leveldb::WriteBatch::Handler>",
]
subset_rationale = "leveldb's real result/view/batch/option surface is bound head-on: leveldb::Status (ok/IsNotFound/IsCorruption/IsIOError/.../ToString -- the result type, checked differentially on ok + IsNotFound + ToString text), leveldb::Slice (the key/value view -- data/size/empty/ToString/compare/starts_with + ==/!= dunders, constructible from a Python str via the std::string ctor + caster), the three plain option structs (Options/ReadOptions/WriteOptions -- mutable POD fields), leveldb::WriteBatch (Put/Delete/Clear/Append/ApproximateSize -- the atomic-update buffer, built head-on and applied atomically), and the CompressionType enum. leveldb::DB CANNOT be bound head-on: LevelDB is built -fno-rtti (its CMakeLists.txt lines 61-76), so the archive emits DB's vtable but not its std::type_info, and nanobind's RTTI-based registry fails to link 'typeinfo for leveldb::DB' (see findings_draft/leveldb-fno-rtti-polymorphic-typeinfo-missing.md). The DB is therefore driven through leveldbtest::KVStore -- a non-polymorphic owning handle whose put/get/del/write methods forward VERBATIM to the genuine DB::Put/Get/Delete/Write, and which also bridges DB::Open's DB** and DB::Get's std::string* out-parameters. KVStore wraps no behavior of its own; the Status/Slice/WriteBatch it returns and takes are the real bound classes. Differential vs the native oracle: open-put-get-delete-get sequence comparing values + Status ok/NotFound + ToString text, NotFound on missing keys, WriteBatch atomicity (batch then read), and re-open persistence."
skipped_features = [
  "leveldb::DB cannot be bound head-on -- LevelDB is built -fno-rtti so the archive lacks DB's std::type_info (only the vtable is present); nanobind's RTTI-based registry then fails to link 'typeinfo for leveldb::DB'. Driven via the leveldbtest::KVStore forwarding handle instead. The non-polymorphic Status/Slice/WriteBatch/option surface is unaffected and bound head-on. (findings_draft/leveldb-fno-rtti-polymorphic-typeinfo-missing.md)",
  "DB::Open (static, DB** out-parameter) -- bridged by KVStore.open; Python cannot drive a DB** out-param",
  "DB::Get (std::string* out-parameter) -- bridged by KVStore.get returning a GetResult{status,value,found}; Python cannot drive a std::string* out-param",
  "DB::NewIterator/GetSnapshot/ReleaseSnapshot/GetApproximateSizes/CompactRange/GetProperty -- return/take the polymorphic Iterator*/Snapshot* (also RTTI-absent) or std::string*/Range* out-params; not surfaced (the put/get/delete/batch differential covers store behavior)",
  "WriteBatch::Handler (pure-virtual Put/Delete visitor) + WriteBatch::Iterate(Handler*) -- excluded; needs a Python-implemented virtual (two-stage), and atomicity is checked via KVStore.write of a batch",
  "Options' collaborator pointers (comparator/env/info_log/block_cache/filter_policy -> Comparator/Env/Logger/Cache/FilterPolicy) -- forward-declared opaque types with no Python meaning; excluded, defaults used",
  "Status' error-constructing statics (NotFound/Corruption/NotSupported/InvalidArgument/IOError) take Slice + have non-bindable default-argument VALUES (a C++26 reflection gap); Status objects are observed as returned by the real DB operations instead",
  "Slice::operator[] (char by index) and remove_prefix/clear (in-place mutation) bound but not core to the differential; data()/size()/ToString()/compare() cover the view",
  "DestroyDB/RepairDB free functions -- DestroyDB surfaced via leveldbtest.destroy_db for test cleanup; RepairDB not exercised",
]
