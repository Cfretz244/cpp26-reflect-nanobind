# Per-run descriptor for spdlog v1.17.0. Consumed by run_gates.py.
slug         = "spdlog"
tier         = 3                          # inheritance + shared_ptr + log-level enums
header_only  = true                       # SPDLOG_HEADER_ONLY mode (no SPDLOG_COMPILED_LIB)
url          = "https://github.com/gabime/spdlog"
pin          = "v1.17.0"                  # commit 79524ddd
include_root = "../../libs/spdlog/include"
main_headers = ["spdlog/spdlog.h", "spdlog/sinks/ostream_sink.h", "spdlog/sinks/stdout_sinks.h", "spdlog/sinks/null_sink.h"]
module_name  = "spdlog_ext"
strategy     = "single_stage"

reflect_args     = ["^^spdlog::logger", "^^spdlog::level", "^^spdlog::pattern_time_type", "^^spdlog::color_mode", "^^nb::match_<^^spdlog::sinks, all_of_<derived_from_<^^spdlog::sinks::sink>, not_<named_<ostream_sink*>>>>", "^^spdlog::sinks::stdout_sink_base<spdlog::details::console_mutex>", "^^logtest"]
subset_rationale = "spdlog::logger is the library's central class, bound head-on: ctors (name / name+sink_ptr), the non-template log(level, string_view) overloads, set_level/level/should_log/name/set_pattern/flush/flush_on/flush_level, sinks() -> vector<shared_ptr<sink>> (the shared_ptr theme), and clone() -> shared_ptr<logger>. spdlog::level is the namespace carrying the level_enum plus to_string_view/to_short_c_str/from_str (the log-level-enum theme, differentially checked). The sink family is selected by ONE match_<^^spdlog::sinks, all_of_<derived_from_<^^sinks::sink>, not_<named_<ostream_sink*>>>> marker -- the corpus's derived_from_ exercise: the leaf accepts the abstract base itself plus every visible concrete sink through the namespace-level *_mt/_st aliases (dealiased to their specs, identical to explicit listing -- the unchanged stdout_sinkConsole_mutex legacy tests are the proof): stdout/stderr sinks (both mutexes), null_sink (its _mt and _st aliases name the SAME null_sink<null_mutex> spec -- one class), and the four ansicolor sinks (ctor takes the seeded color_mode enum; their ansicolor_sink<M> intermediate is not independently in the bind set, so set_color/should_color/the color-code string_view members flatten onto them and sink is the real Python base). The intermediate stdout_sink_base<console_mutex> is still LISTED EXPLICITLY (a template spec the namespace walk cannot reach) so the stdout chain binds as real 3-level Python bases (the inheritance theme) -- its only signature self-mentions are deleted copy/move operators, which pull nothing into the bind set (BINDER-0012), so without the explicit opt-in it would flatten. The logtest fixture owns an ostringstream-backed ostream_sink and hands it out as shared_ptr<sinks::sink>, so Python-driven logging is captured as text and compared byte-for-byte against the native oracle driving the identical sequence. Built with SPDLOG_USE_STD_FORMAT (a first-class spdlog config) so string_view_t/format_string_t are the std types the nanobind casters cover; the default bundled-fmt mode's fmt::basic_string_view has no caster."
skipped_features = [
  "templated log front-ends (logger::info/warn/... take std::format_string<Args...> -- consteval first param, intrinsically not bindable; the non-template log(level, string_view) overloads are the bindable surface)",
  "Python-implemented custom sinks (sink's pure virtuals need a two-stage trampoline; virtual-override path already proven by _fixture_virtual, kept out of this run)",
  "set_formatter(unique_ptr<formatter>) -- by-value move-only param, skipped per BINDER-0010",
  "sinks_init_list ctor (initializer_list has no Python representation)",
  "ostream_sink bound directly (ctor takes std::ostream& -- no caster; wrapped by the logtest CaptureSink fixture instead, and gated out of the derived_from_ match by not_<named_<ostream_sink*>>)",
  "ansicolor ctor default (color_mode::automatic) and the base ansicolor_sink(FILE*, color_mode) ctor -- the default VALUE is the P3096 gap (tests pass color_mode explicitly); base ctors are not inherited, so FILE* appears in no bound signature",
]

extra_cflags = ["-fconstexpr-steps=134217728"]  # raised for plain-class discovery (more reachable types)

[emit]
enabled = true
