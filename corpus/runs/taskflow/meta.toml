# Per-run descriptor for taskflow v4.0.0. Consumed by run_gates.py.
slug         = "taskflow"
tier         = 4                          # task-graph engine: graph shape + execution ordering
header_only  = true                       # header-only, <taskflow/taskflow.hpp>
url          = "https://github.com/taskflow/taskflow"
pin          = "v4.0.0"
include_root = "../../libs/taskflow"
main_headers = ["taskflow/taskflow.hpp"]
module_name  = "taskflow_ext"
strategy     = "single_stage"
# Taskflow's three core classes (esp. Executor, with its work-stealing queues and
# SmallVector internals) carry large member/overload sets; the binder's discovery +
# bind fixpoint over them exceeds the default constexpr step budget, as the heavy
# json/abseil/pugixml runs do. Raised for the binding (Gate 4) compile.
extra_cflags = ["-fconstexpr-steps=33554432"]

reflect_args     = [
  "^^tf::Taskflow",
  "^^tf::Task",
  "^^tf::Executor",
  "^^tftest",
  "^^nb::exclude_<^^tf::Future, ^^tf::WorkerInterface, ^^tf::Graph, ^^tf::FlowBuilder, ^^std::basic_ostream>",
]
subset_rationale = "Taskflow's three core classes are bound head-on: tf::Taskflow (the task-graph container -- num_tasks/empty/name/dump()->string/clear), tf::Task (the lightweight task handle -- name/num_successors/num_predecessors/num_strong_dependencies/num_weak_dependencies/empty/has_work/hash_value + == / != dunders), and tf::Executor (the work-stealing scheduler -- num_workers from an explicit worker-count ctor arg, plus num_topologies/num_taskflows/num_observers). The graph-construction front (FlowBuilder::emplace / Task::precede / succeed) is entirely templated over C++ callables and variadic Task packs and cannot be driven from Python, so the tftest.Diamond fixture builds a FIXED diamond graph (A -> {B,C} -> D) whose task bodies append their names to an execution-order log and bump an atomic counter; it hands out the REAL tf::Taskflow + tf::Task handles (queried head-on for shape) and drives a REAL tf::Executor::run().wait() for execution. tftest.Engine owns a tf::Executor constructed with an EXPLICIT worker count and hands out the real tf::Executor (its sole ctor's move-only 2nd param leaves it unconstructable from Python directly). Both fixtures return the real classes by POINTER, not reference: a method returning T& to a registered class currently defaults to rv_policy::copy and aborts on these move-only types (see findings_draft/lvalue-ref-class-return-copy-policy.md); a raw class-pointer return is borrowed correctly. Differential: the native oracle builds the identical diamond through the same fixture, then emits graph-shape numbers (num_tasks; per-task num_successors/num_predecessors/strong/weak for A/B/C/D), the executor worker count from an explicit ctor arg, the post-run task-body count, and order-constraint booleans; the Python test asserts equality on all shape numbers + worker count + counter and the dependency ORDER CONSTRAINTS (A first, D last, B and C both after A and before D) rather than exact interleavings."
skipped_features = [
  "FlowBuilder::emplace / Task::precede / succeed -- variadic templates over C++ callables and Task packs; not Python-expressible (the whole graph-construction front). Graph wiring is done in the tftest.Diamond fixture; the resulting REAL Task handles are queried head-on.",
  "tf::Executor::run / corun and the algorithm fronts (for_each/transform/reduce/sort/pipeline) -- all templated over callables; run is driven through the fixture and returns tf::Future<void> (inherits std::future<void>, no caster, excluded).",
  "tf::Executor's SOLE constructor Executor(size_t N, std::unique_ptr<WorkerInterface> = nullptr) -- the move-only/excluded 2nd param means the binder binds NO __init__ for Executor (it imports with 'no constructor defined'), so Python cannot construct one directly. The tftest.Engine fixture constructs it with N workers and hands out the real tf::Executor; num_workers() is checked against the N passed. (Not a bug -- the only ctor genuinely isn't Python-expressible; just noting Executor is fixture-constructed.)",
  "lvalue-reference returns of registered classes (tf::Taskflow& / tf::Executor&) -- the binder defaults T& returns to rv_policy::copy, which aborts at runtime on these move-only types (findings_draft/lvalue-ref-class-return-copy-policy.md). The fixture returns tf::Taskflow*/tf::Executor* (borrowed) instead; no real taskflow method returning T& is bound head-on in this run.",
  "library: taskflow v4.0.0 uses std::bit_ceil/std::bit_width (core/wsq.hpp, core/executor.hpp) but never #includes <bit>; on this from-source libc++ <bit> is not pulled in transitively, so <taskflow/taskflow.hpp> fails to compile. Worked around by #include <bit> before the umbrella header in the fixture/binding (findings_draft/taskflow-missing-bit-include.md -- library-side missing-include).",
  "Taskflow::dump(std::ostream&) / Task::dump(std::ostream&) -- ostream& param, no caster; the no-arg Taskflow::dump()->std::string overload is bound and exercised (DOT output is non-deterministic across hash-ordered traversal so its TEXT is not asserted, only that it is non-empty and mentions every task name).",
  "Task::for_each_successor / for_each_predecessor / for_each_subflow_task -- template visitor params; successor/predecessor COUNTS are checked head-on via num_successors/num_predecessors instead.",
  "tf::Future<void> (Executor::run result), tf::Graph, tf::FlowBuilder, tf::WorkerInterface -- excluded; internal / templated / non-bindable types surfaced through the fixture's run() instead.",
  "default-argument VALUES (Executor's N = hardware_concurrency()) are a C++26 reflection gap; the fixture/tests pass an explicit worker count so both sides drive identical ctors.",
]
