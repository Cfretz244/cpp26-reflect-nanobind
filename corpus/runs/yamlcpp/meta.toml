# Per-run descriptor for yaml-cpp 0.9.0. Consumed by run_gates.py.
slug         = "yamlcpp"
tier         = 3
header_only  = false                       # libyaml-cpp.a is a real compiled lib
url          = "https://github.com/jbeder/yaml-cpp"
pin          = "yaml-cpp-0.9.0"
include_root = "../../libs/yamlcpp/include"
main_headers = ["yaml-cpp/yaml.h"]
module_name  = "yamlcpp_ext"
strategy     = "single_stage"
# Prebuilt static archive (driver-built via corpus/lib/build_cmake_lib.sh). Applied to both
# the module link and the native oracle.
extra_libs   = "-L {repo}/build/yamlcpp-install/lib -lyamlcpp_merged"
# Node carries large member-template + overload sets; discovery + caster + bind fixpoint over
# the YAML namespace exceeds the default constexpr step budget.
extra_cflags = ["-fconstexpr-steps=33554432"]

reflect_args = [
  "^^YAML::Node",
  "^^YAML::Mark",
  "^^YAML::NodeType::value",
  "^^YAML::EmitterStyle::value",
  "^^YAML::Dump",
  "^^YAML::Clone",
  "^^yamlfix",
  "^^nb::exclude_<^^YAML::detail::node, ^^YAML::detail::node_data, ^^YAML::detail::iterator_value, ^^YAML::detail::shared_memory_holder, ^^YAML::Emitter, ^^std::basic_ostream, ^^std::basic_istream>",
]

[emit]
enabled = true
# Stage-2 prod cflags default to the constexpr extra_cflags minus reflection flags
# (here that strips -fconstexpr-steps, leaving nothing for the prod compiler). The
# prod archive (libyamlcpp_merged.a under build/yamlcpp-install-prod/) is built with
# Apple Clang + system libc++; run_gates rewrites the extra_libs prefix to the
# -install-prod variant automatically. No extra_cflags override needed.
subset_rationale = "yaml-cpp's central type YAML::Node is bound head-on (value semantics): Type()->NodeType enum, IsNull/IsScalar/IsSequence/IsMap/IsDefined, size(), Scalar(), Tag()/SetTag(), Style()/SetStyle(), reset(), is(). YAML::NodeType::value and YAML::EmitterStyle::value are real enums bound with all values. YAML::Mark (the source-location struct: pos/line/column + is_null) is bound head-on. The free functions YAML::Dump(const Node&)->std::string (serialization), YAML::Clone, and YAML::operator== are bound directly. The yamlfix fixture supplies ONLY what the real API expresses solely as member templates the binder cannot instantiate: Node::as<int/double/bool/string>() (scalar coercion -- the library's central typed accessor, a non-defaulted free type parameter T) and Node::operator[](string/int) (keyed/indexed access; the non-template operator[](const Node&) overload is a spliced-signature shape the binder skips). Differential: oracle_native.cpp parses one fixed multi-document-shaped YAML string natively (a map with scalar/sequence/nested-map children) and emits node Type() enums, scalar coercions (int/double/bool/string), sequence + map sizes, keyed/indexed access values, the Dump() round-trip text, and a malformed-input error path; test_bindings.py drives the SAME string through the binding and asserts byte-for-byte equality, plus the as<T>(fallback) BadConversion-swallow and an isinstance/exception-type layer."
skipped_features = [
  "Node::as<T>() and Node::operator[](Key) are MEMBER TEMPLATES (non-defaulted type parameter); the binder cannot instantiate them, so scalar coercion + keyed access are surfaced through the yamlfix forwarders (one concrete instantiation each). This is the only fixture use; everything else is head-on.",
  "iterator/range traversal (Node::begin/end -> YAML::iterator/const_iterator, the detail::iterator_value proxy) -- excluded; size() + get_key/get_idx cover container walking head-on",
  "stream/emitter serialization (operator<<(Emitter&/ostream&, Node), Load(istream&)) -- no ostream/istream caster; Dump(const Node&)->string covers serialization head-on, Load drives from std::string",
  "Load is an overload SET (const string&/const char*/istream&); passing ^^YAML::Load directly to reflect_ is an ambiguous reflection, so the single std::string overload is forwarded through the yamlfix.load fixture (one unambiguous parse front). Dump(const Node&) and Clone(const Node&) are NOT overloaded and bind head-on off ^^YAML::Dump / ^^YAML::Clone. LoadAll/LoadAllFromFile (std::vector<Node>, multi-document) not exercised.",
  "EmitterStyle::value enum: REFLECTED. It shares the unqualified Python name 'value' with NodeType::value; under BINDER-0022 the first registered (NodeType::value, the differential's primary enum via Node::Type()) keeps the bare module attribute 'value' and the second (EmitterStyle::value, Node::Style()'s return) binds parent-qualified as 'EmitterStyle_value' instead of clobbering it. Both the constexpr and emit modules render the same runtime hasattr fallback, so both expose the identical (value, EmitterStyle_value) pair (asserted in test_bindings.py).",
  "Node mutation via operator= / push_back / force_insert / Assign are MEMBER TEMPLATES (non-defaulted T) -- skipped; the differential is read-path over a parsed document, which is yaml-cpp's primary use",
  "default-argument VALUES (SetStyle/reset defaults) are a C++26 reflection gap (P3096 exposes has_default_argument but not the value); the tests pass defaulted args explicitly",
  "the real C++ exception TYPE (ParserException/BadConversion) is not distinguishable in Python: nanobind's default translator maps unknown std::exception-derived throws to RuntimeError carrying what(); the error-path differential asserts on the message text + RuntimeError, matching the native oracle's caught what()",
]
